openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Sentinel Executive Intelligence System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: briefing
    description: Executive intelligence briefings
  - name: priorities
    description: AI-ranked daily priorities
  - name: intelligence
    description: AI intelligence insights and pattern analysis
  - name: recommendations
    description: Evidence-backed AI recommendations
  - name: performance
    description: Performance metrics and analytics
  - name: integrations
    description: Data source integrations
  - name: subscription
    description: Subscription management
  - name: profile
    description: User profile
  - name: openai
    description: OpenAI AI chat and analysis operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Briefing ──────────────────────────────────────────────
  /briefing/today:
    get:
      operationId: getTodaysBriefing
      tags: [briefing]
      summary: Get today's executive briefing
      responses:
        "200":
          description: Today's briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"

  /briefing/history:
    get:
      operationId: getBriefingHistory
      tags: [briefing]
      summary: List past briefings
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Past briefings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BriefingSummary"

  /briefing/{id}:
    get:
      operationId: getBriefingById
      tags: [briefing]
      summary: Get a specific briefing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Priorities ────────────────────────────────────────────
  /priorities:
    get:
      operationId: getPriorities
      tags: [priorities]
      summary: Get AI-ranked daily priorities
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Ranked priorities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Priority"

  /priorities/{id}/complete:
    patch:
      operationId: completePriority
      tags: [priorities]
      summary: Mark a priority as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated priority
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Priority"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Intelligence ──────────────────────────────────────────
  /intelligence:
    get:
      operationId: getIntelligence
      tags: [intelligence]
      summary: Get AI intelligence insights
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [productivity, communication, meetings, projects, all]
            default: all
      responses:
        "200":
          description: Intelligence insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  /intelligence/summary:
    get:
      operationId: getIntelligenceSummary
      tags: [intelligence]
      summary: Get executive summary metrics for dashboard
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutiveSummary"

  # ── Recommendations ───────────────────────────────────────
  /recommendations:
    get:
      operationId: getRecommendations
      tags: [recommendations]
      summary: Get AI recommendations with evidence
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, dismissed, all]
            default: active
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"

  /recommendations/{id}/dismiss:
    patch:
      operationId: dismissRecommendation
      tags: [recommendations]
      summary: Dismiss a recommendation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Performance ───────────────────────────────────────────
  /performance:
    get:
      operationId: getPerformanceMetrics
      tags: [performance]
      summary: Get performance metrics for a time range
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [daily, weekly, monthly, yearly]
            default: weekly
      responses:
        "200":
          description: Performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceMetrics"

  /performance/trends:
    get:
      operationId: getPerformanceTrends
      tags: [performance]
      summary: Get performance trend series for charting
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [weekly, monthly, yearly]
            default: weekly
      responses:
        "200":
          description: Trend data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  # ── Integrations ──────────────────────────────────────────
  /integrations:
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: List available integrations and their status
      responses:
        "200":
          description: Integrations list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /integrations/{id}:
    patch:
      operationId: updateIntegration
      tags: [integrations]
      summary: Connect or disconnect an integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: Updated integration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Subscription ──────────────────────────────────────────
  /subscription:
    get:
      operationId: getSubscription
      tags: [subscription]
      summary: Get current subscription status
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /subscription/upgrade:
    post:
      operationId: upgradeSubscription
      tags: [subscription]
      summary: Initiate subscription upgrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionUpgradeInput"
      responses:
        "200":
          description: Upgrade confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionUpgradeResult"

  # ── Profile ───────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile and preferences
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ── OpenAI Chat ───────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive streaming response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Briefing ──
    Briefing:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        greeting:
          type: string
        headline:
          type: string
        executiveSummary:
          $ref: "#/components/schemas/ExecutiveSummary"
        priorities:
          type: array
          items:
            $ref: "#/components/schemas/Priority"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/Insight"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        generatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - greeting
        - headline
        - executiveSummary
        - priorities
        - insights
        - recommendations
        - generatedAt

    BriefingSummary:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        headline:
          type: string
        priorityCount:
          type: integer
        insightCount:
          type: integer
        generatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - headline
        - priorityCount
        - insightCount
        - generatedAt

    ExecutiveSummary:
      type: object
      properties:
        productivityScore:
          type: integer
          description: 0-100
        focusScore:
          type: integer
          description: 0-100
        upcomingDeadlines:
          type: integer
        pendingEmails:
          type: integer
        meetingsToday:
          type: integer
        activeProjects:
          type: integer
        workloadLevel:
          type: string
          enum: [low, moderate, high, critical]
        tasksCompleted:
          type: integer
        tasksTotal:
          type: integer
      required:
        - productivityScore
        - focusScore
        - upcomingDeadlines
        - pendingEmails
        - meetingsToday
        - activeProjects
        - workloadLevel
        - tasksCompleted
        - tasksTotal

    # ── Priorities ──
    Priority:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        reasoning:
          type: string
        estimatedMinutes:
          type: integer
        deadline:
          type: ["string", "null"]
          format: date-time
        confidenceLevel:
          type: integer
          description: 0-100
        category:
          type: string
          enum: [email, meeting, project, task, review, other]
        rank:
          type: integer
        isCompleted:
          type: boolean
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - reasoning
        - estimatedMinutes
        - deadline
        - confidenceLevel
        - category
        - rank
        - isCompleted
        - completedAt
        - createdAt

    # ── Intelligence ──
    Insight:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [productivity, communication, meetings, projects, behavior, other]
        severity:
          type: string
          enum: [positive, neutral, warning, critical]
        dataPoints:
          type: array
          items:
            type: string
        confidenceLevel:
          type: integer
          description: 0-100
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - description
        - category
        - severity
        - dataPoints
        - confidenceLevel
        - createdAt

    # ── Recommendations ──
    Recommendation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        reasoning:
          type: string
        confidenceLevel:
          type: integer
          description: 0-100
        evidence:
          type: array
          items:
            type: string
        sourceType:
          type: string
          enum: [personal_data, research, combined]
        isDismissed:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - reasoning
        - confidenceLevel
        - evidence
        - sourceType
        - isDismissed
        - createdAt

    # ── Performance ──
    PerformanceMetrics:
      type: object
      properties:
        range:
          type: string
        focusHours:
          type: number
        deepWorkHours:
          type: number
        meetingHours:
          type: number
        emailResponseTimeMinutes:
          type: number
        projectsCompleted:
          type: integer
        tasksFinished:
          type: integer
        codingActivityMinutes:
          type: integer
        learningHours:
          type: number
        workloadTrend:
          type: string
          enum: [increasing, stable, decreasing]
        comparedToPrevious:
          $ref: "#/components/schemas/MetricsDelta"
      required:
        - range
        - focusHours
        - deepWorkHours
        - meetingHours
        - emailResponseTimeMinutes
        - projectsCompleted
        - tasksFinished
        - codingActivityMinutes
        - learningHours
        - workloadTrend
        - comparedToPrevious

    MetricsDelta:
      type: object
      properties:
        focusHoursChange:
          type: number
        deepWorkChange:
          type: number
        tasksChange:
          type: integer
        productivityChange:
          type: number
      required:
        - focusHoursChange
        - deepWorkChange
        - tasksChange
        - productivityChange

    TrendPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        productivityScore:
          type: integer
        focusHours:
          type: number
        tasksCompleted:
          type: integer
        meetingHours:
          type: number
      required:
        - date
        - productivityScore
        - focusHours
        - tasksCompleted
        - meetingHours

    # ── Integrations ──
    Integration:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        isConnected:
          type: boolean
        lastSyncAt:
          type: ["string", "null"]
          format: date-time
        category:
          type: string
          enum: [email, calendar, productivity, code, communication, other]
      required:
        - id
        - name
        - description
        - icon
        - isConnected
        - lastSyncAt
        - category

    IntegrationUpdate:
      type: object
      properties:
        isConnected:
          type: boolean
      required:
        - isConnected

    # ── Subscription ──
    Subscription:
      type: object
      properties:
        plan:
          type: string
          enum: [trial, pro, enterprise]
        status:
          type: string
          enum: [active, expired, cancelled, trial]
        trialDaysRemaining:
          type: ["integer", "null"]
        currentPeriodEnd:
          type: ["string", "null"]
          format: date-time
        features:
          type: array
          items:
            type: string
      required:
        - plan
        - status
        - trialDaysRemaining
        - currentPeriodEnd
        - features

    SubscriptionUpgradeInput:
      type: object
      properties:
        plan:
          type: string
          enum: [pro, enterprise]
      required:
        - plan

    SubscriptionUpgradeResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        plan:
          type: string
      required:
        - success
        - message
        - plan

    # ── Profile ──
    UserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        title:
          type: string
        salutation:
          type: string
          description: Preferred greeting (sir/ma'am/name)
        timezone:
          type: string
        briefingTime:
          type: string
          description: Preferred briefing generation time HH:MM
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - title
        - salutation
        - timezone
        - briefingTime
        - createdAt

    UserProfileUpdate:
      type: object
      properties:
        displayName:
          type: string
        title:
          type: string
        salutation:
          type: string
        timezone:
          type: string
        briefingTime:
          type: string

    # ── OpenAI ──
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
